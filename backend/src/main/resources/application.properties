spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/schemeguard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:schemeguard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:schemeguard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=schemeguard-development-secret-key-minimum-32-characters
app.jwt.access-token-expiration=900000
